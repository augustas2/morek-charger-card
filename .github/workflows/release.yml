name: Validate

on:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci
            - run: npm run check
            - run: npm run build

            - name: Validate HACS repository
              uses: hacs/action@main
              with:
                  category: plugin
